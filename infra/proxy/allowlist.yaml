# Egress allowlist (docs/INFRASTRUCTURE.md N2): the hosts containers may reach through the egress
# proxy, one per line (Squid dstdomain syntax; a leading dot also allows subdomains).
# LASS / development container: the Claude API and sign-in, the npm registry, GitHub.
# Claude Code 2.1.296 signed in and worked with api.anthropic.com and platform.claude.com only (proxy log,
# 2026-10-17). Refused on purpose: mcp-proxy.anthropic.com (claude.ai connectors) and downloads.claude.ai
# (updates). Denied requests show up in the proxy's log; add hosts only after review.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lass-egress-allowlist
data:
  domains: |
    api.anthropic.com
    platform.claude.com
    registry.npmjs.org
    github.com
    codeload.github.com
    objects.githubusercontent.com
    raw.githubusercontent.com
