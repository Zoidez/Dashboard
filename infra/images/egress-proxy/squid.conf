# Egress proxy for Dashboard containers (docs/INFRASTRUCTURE.md N2).
# Only HTTPS tunnels (CONNECT to port 443) to hosts in the allowlist pass; everything else is denied.
# The allowlist is the ConfigMap lass-egress-allowlist, mounted at /etc/squid/allow (infra/k8s/lass-egress.yaml).
# IPv4 explicitly: inside gVisor a socket on [::] does not take IPv4 connections (seen 2026-10-17).
http_port 0.0.0.0:3128
visible_hostname lass-egress
# Outside names are resolved by the DNS of the network "egress" (fixed subnet 10.89.250.0/24, created by the
# backend / setup\lass-dev.ps1); the internal network's DNS answers only for pods (INFRASTRUCTURE.md, N1 note).
dns_nameservers 10.89.250.1

acl allowed dstdomain "/etc/squid/allow/domains"
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !https_port
http_access allow CONNECT allowed
http_access deny all

# No cache, no files: the root filesystem is read-only; logs go to standard output (L1).
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
pid_filename /tmp/squid.pid
coredump_dir /tmp
via off
forwarded_for delete
