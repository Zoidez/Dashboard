# Egress proxy pod (docs/INFRASTRUCTURE.md N2, D1-D4, X2). Joins lass-internal and the outside
# network "egress"; nothing else does. {{IMAGE}} is filled in with the built image (tagged with its git commit).
# Run: podman kube play --network lass-internal --network egress --configmap infra/proxy/allowlist.yaml <this file>
apiVersion: v1
kind: Pod
metadata:
  name: lass-egress
  labels: { app: lass-egress }
spec:
  containers:
    - name: proxy
      image: "{{IMAGE}}"
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits: { cpu: "500m", memory: "256Mi" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      readinessProbe: { exec: { command: ["sh", "-c", "nc -z 127.0.0.1 3128"] }, periodSeconds: 30 }
      livenessProbe: { exec: { command: ["sh", "-c", "nc -z 127.0.0.1 3128"] }, periodSeconds: 60 }
      volumeMounts:
        - { name: allowlist, mountPath: /etc/squid/allow, readOnly: true }
        - { name: tmp, mountPath: /tmp }
        - { name: squid-run, mountPath: /var/run/squid }
        - { name: squid-cache, mountPath: /var/cache/squid }
        - { name: squid-log, mountPath: /var/log/squid }
  volumes:
    - { name: allowlist, configMap: { name: lass-egress-allowlist } }
    - { name: tmp, emptyDir: {} }
    - { name: squid-run, emptyDir: {} }
    - { name: squid-cache, emptyDir: {} }
    - { name: squid-log, emptyDir: {} }
